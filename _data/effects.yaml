- id: projectEdit.project.scenes.{scene}.layers.{layer}.paintEffects.value.gradient_wipe
  name: Gradient Wipe
  description: Mask an object
  type: layer
  category: masking
  properties:
    - name: Type
      description: |
        Determines whether the object is masked from a certain side of a masking line or a circle mask is applied 
        When Linear masking is selected a line splitting an object into two parts appears and the first object part
        is hidden while the other is shown on the opposite side of the line
      type: enumeration
      units: unavailable
      default: Linear
      json:
        id: projectEdit.project.scenes.{scene}.layers.{layer}.paintEffects.value.gradient_wipe.type.keyed
        type: string

    - name: Angle
      description: |
        Specifies a rotation angle of the masking line

        - 0 angle makes the line hide bottom object part and points to -X direction
        - 90 angle makes the line hide left object part and points in -Y direction
        - 180 angle makes the line hide top object part and points in X direction
        - 270 angle makes the line hide right object part and points in Y direction
      type: number
      units: degrees
      default: 0
      json:
        id: projectEdit.project.scenes.{scene}.layers.{layer}.paintEffects.value.gradient_wipe.linearAngle.keyed
        type: number

    - name: Center / X
      description: |
        Specifies displacement of masking circle center in percents relatively to the object width

        - 0 displacement points to the left edge of the object
        - 50 displacement points to the center's X of the object
        - 100 displacement points to the right edge of the object
      type: number
      units: percents
      default: 50
      range:
        from: 0
        to: 100
      json:
        id: projectEdit.project.scenes.{scene}.layers.{layer}.paintEffects.value.gradient_wipe.radialCenter.keyed.x
        type: number

    - name: Center / Y
      description: |
        Specifies displacement of masking circle center in percents relatively to the object height

        - 0 displacement points to the top edge of the object
        - 50 displacement points to the center's Y of the object
        - 100 displacement points to the bottom edge of the object
      type: number
      units: percents
      default: 50
      range:
        from: 0
        to: 100
      json:
        id: projectEdit.project.scenes.{scene}.layers.{layer}.paintEffects.value.gradient_wipe.radialCenter.keyed.y
        type: number

    - name: Progress
      description: |
        Specifies how much masking process progressed

        - 0 means masking has not been started
        - 50 means half of masking process is done
        - 100 means complete object is hidden
      type: number
      units: percents
      default: 50
      range:
        from: 0
        to: 100
      json:
        id: projectEdit.project.scenes.{scene}.layers.{layer}.paintEffects.value.gradient_wipe.radialCenter.progress.keyed
        type: number

    - name: Progress
      description: Specifies masking border blur strength
      type: number
      units: unavailable
      default: 0
      range:
        from: 0
        to: infinity
      json:
        id: projectEdit.project.scenes.{scene}.layers.{layer}.paintEffects.value.gradient_wipe.radialCenter.feather.keyed
        type: number

